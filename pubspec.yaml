name: not_clock
description: Not Clock - a cross-platform alarm app with better functionality than clock
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  file_picker: ^8.0.0
  in_app_review: ^2.0.10
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0
  screen_brightness: ^2.1.4
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/alarms/
    - assets/sounds/timers/
